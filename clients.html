<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Tracker</title>
<meta name="description" content="Track borrowers, loan milestones and notes, and copy milestone update emails. Saved only in this browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Use the same color scheme the visitor picked on the dashboard.
  (function(){
    var v="auto";try{v=localStorage.getItem("theme")||"auto";}catch(e){}
    var r=document.documentElement,dark={night:1,harbor:1};
    if(v!=="auto"){r.dataset.theme=dark[v]?"dark":"light";if(v!=="classic")r.dataset.palette=v;}
  })();
</script>
<style>
:root{
  --paper:#F3F5F8; --panel:#FFFFFF; --ink:#14233C; --muted:#5B6A80; --rule:#D9DEE6;
  --good:#2C5234; --goodtxt:#1F7A5A; --bad:#B4412F; --brass:#A97A1E; --goodbg:#E5F3EC; --tipbg:#FBF4E4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1726; --panel:#16213A; --ink:#E8EDF5; --muted:#9AA8BD; --rule:#2A3756;
    --good:#3F8A55; --goodtxt:#4CC197; --bad:#F08A73; --brass:#E0B455; --goodbg:#143329; --tipbg:#2C2717;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1726; --panel:#16213A; --ink:#E8EDF5; --muted:#9AA8BD; --rule:#2A3756;
  --good:#3F8A55; --goodtxt:#4CC197; --bad:#F08A73; --brass:#E0B455; --goodbg:#143329; --tipbg:#2C2717;
}
:root[data-palette="forest"]{--paper:#F2F5F1;--panel:#FFFFFF;--ink:#1D3B2A;--muted:#5C6E62;--rule:#D5DDD6;--bad:#B4412F;--brass:#A8731F;--goodbg:#E4F1E8;--tipbg:#FAF3E3}
:root[data-palette="burgundy"]{--paper:#F7F3F2;--panel:#FFFFFF;--ink:#4A1D27;--muted:#7A6266;--rule:#E3D8D8;--bad:#C0392B;--brass:#9A7020;--goodbg:#E5F3EC;--tipbg:#FAF3E3}
:root[data-palette="harbor"]{--paper:#0E1F24;--panel:#15303A;--ink:#E6F1F1;--muted:#94B0B4;--rule:#24454F;--bad:#F2907A;--brass:#E8B860;--goodbg:#15372E;--tipbg:#2F2C1A}
:root[data-palette="night"]{--paper:#0F1726;--panel:#16213A;--ink:#E8EDF5;--muted:#9AA8BD;--rule:#2A3756;--bad:#F08A73;--brass:#E0B455;--goodbg:#143329;--tipbg:#2C2717}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.5;
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 48px)}
a{color:inherit}
.back{font-size:.9rem;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.back:hover{color:var(--brass)}
h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15}
h2{font-size:1.15rem;font-weight:700;margin:0}
h3{font-size:1rem;font-weight:700;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.tbtn{font-size:.88rem;font-weight:600;background:var(--panel);border:1px solid var(--rule);padding:7px 12px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}
.tbtn:hover{border-color:var(--ink)}
.tbtn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tbtn.danger{color:var(--bad)}
.tbtn:disabled{opacity:.45;cursor:default}
.note-local{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--panel);
  padding:10px 16px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center;z-index:50}
.toast.on{opacity:1}
.panel{background:var(--panel);border:1px solid var(--rule);padding:16px}
.backupwarn{margin-top:12px;padding:10px 14px;background:var(--tipbg);border-left:4px solid var(--brass);font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}

/* List */
.listbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:16px 0 10px}
.tabs{display:flex;border:1px solid var(--rule)}
.tabs button{background:var(--panel);border:0;border-right:1px solid var(--rule);padding:7px 14px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.search{padding:8px 10px;border:1px solid var(--rule);background:var(--panel);min-width:0;flex:1;max-width:320px}
.rows{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--rule)}
.rows li{border-top:1px solid var(--rule)}
.rows li:first-child{border-top:0}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:6px 20px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;color:var(--ink)}
.row:hover{background:var(--paper)}
.row .nm{font-weight:700;font-size:1.02rem}
.row .sub{font-size:.85rem;color:var(--muted)}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.row .stat{font-size:.85rem;margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.row .stat b{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.row .co{font-weight:500;color:var(--muted);font-size:.9rem}
.mini{display:flex;align-items:center;padding:3px 0}
.mini b{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule);background:var(--panel);flex:none}
.mini b.done{background:var(--good);border-color:var(--good)}
.mini b.next{background:var(--brass);border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 25%,transparent)}
.mini i{flex:1;height:2px;background:var(--rule)}
.mini i.on{background:var(--good)}
.dates{display:grid;grid-template-columns:auto auto;gap:1px 10px;margin:0;font-size:.8rem;white-space:nowrap}
.dates div{display:contents}
.dates dt{color:var(--muted)}
.dates dd{margin:0;font-weight:600;text-align:right}
@media (max-width:860px){.row{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.dates{grid-column:1/-1;grid-template-columns:repeat(3,auto);justify-content:start;gap:0 18px}.dates div{display:flex;gap:6px}}
@media (max-width:640px){.row{grid-template-columns:1fr}.row .stat{flex-direction:column;gap:0}.search{max-width:none;flex-basis:100%}}

/* Detail */
.dhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;margin-top:6px}
.dhead .info{font-size:.9rem;color:var(--muted)}
.dhead .info span+span::before{content:" · "}
.seg{display:inline-flex;border:1px solid var(--rule)}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--rule);padding:6px 12px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.stack{display:grid;gap:16px}

/* Milestone tracker (horizontal, like a lender portal) */
.tracker{display:grid;grid-template-columns:repeat(8,1fr);margin:16px 0 4px;position:relative}
.tracker .st{text-align:center;position:relative;font-size:.74rem;line-height:1.25;padding:0 2px}
.tracker .st::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--rule);z-index:0}
.tracker .st:first-child::before{display:none}
.tracker .st.done::before,.tracker .st.next::before{background:var(--good)}
.dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:700;font-size:.85rem;position:relative;z-index:1;
  background:var(--panel);border:2px solid var(--rule);color:var(--muted)}
.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.next .dot{background:var(--brass);border-color:var(--brass);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--brass) 25%,transparent)}
.tracker .lbl{font-weight:600}
.tracker .dt{color:var(--muted);font-size:.7rem}
.tracker .subs{display:inline-grid;gap:1px;margin-top:6px;text-align:left;font-size:.72rem;color:var(--muted)}
.tracker .sb.done{color:var(--goodtxt);font-weight:600}
.tracker .sb span{color:var(--muted);font-weight:400}
@media (max-width:760px){.tracker{display:none}}

.msl{list-style:none;margin:10px 0 0;padding:0}
.msl li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.msl li:first-child{border-top:0}
.msl .dot{width:26px;height:26px;margin:0;font-size:.75rem}
.msl label{font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.msl input[type=checkbox]{width:18px;height:18px;accent-color:var(--good);margin:0}
.msl input[type=date]{padding:4px 6px;border:1px solid var(--rule);background:var(--paper);font-size:.85rem;max-width:150px}
.msl li.sub{padding-left:42px;grid-template-columns:22px minmax(0,1fr) auto}
.msl li.sub .dot{width:18px;height:18px;font-size:.65rem;border-width:2px}
.msl li.sub label{font-weight:500}
.msl .grp{font-weight:700}
.lblwrap{display:grid;gap:4px}
.closeat{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.closeat input{padding:4px 6px;border:1px solid var(--rule);background:var(--paper);font-size:.85rem}
/* Conditions banner and list */
.cbanner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--brass);border-radius:10px;padding:10px 14px;margin-top:12px}
.cbanner .arrow{color:var(--brass);font-weight:700;font-size:1.15rem;line-height:1}
.cbanner .cnum{background:var(--brass);color:#fff;border-radius:999px;min-width:28px;height:28px;padding:0 6px;display:grid;place-items:center;font-weight:700;font-size:.82rem}
.cbanner b{color:var(--brass)}
.cbanner .grow{flex:1;min-width:200px;font-size:.92rem}
.cbanner.clear{border-left-color:var(--good)}
.cbanner.clear .arrow,.cbanner.clear b{color:var(--goodtxt)}
.cbanner.clear .cnum{background:var(--good)}
.cbanner.empty{border-left-color:var(--rule)}
.cbanner.empty .arrow{color:var(--muted)}
.tbtn.gold{background:var(--brass);border-color:var(--brass);color:#fff;border-radius:6px}
.conds{margin-top:8px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clist{list-style:none;margin:10px 0 0;padding:0}
.clist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--rule)}
.clist li:first-child{border-top:0}
.clist .cn{font-weight:700;color:var(--brass);text-align:right}
.clist label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.clist input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--good);flex:none}
.clist .ct{white-space:pre-wrap;overflow-wrap:anywhere}
.clist li.done .ct{text-decoration:line-through;color:var(--muted)}
.clist li.done .cn{color:var(--muted)}
.clist li.csep{display:block;padding:10px 0 2px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clist .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 6px}
.clist .x:hover{color:var(--bad)}
.clist .cact{display:flex;gap:2px;align-items:center}
.clist .cmove{background:none;border:1px solid var(--rule);color:var(--muted);cursor:pointer;font-size:.72rem;font-weight:600;padding:1px 6px;white-space:nowrap}
.clist .cmove:hover{border-color:var(--ink);color:var(--ink)}
.cgroup{margin-top:12px}
.cgroup h4{font-size:.9rem;margin:0;padding:6px 0 2px;border-bottom:2px solid var(--brass);color:var(--brass)}
.cgroup+.cgroup h4{border-bottom-color:var(--muted);color:var(--muted)}
.cbanner .csplit{display:inline-block;font-size:.8rem;color:var(--muted);margin-left:4px}
.upline{margin:4px 0 0 26px;overflow-wrap:anywhere}
.cwho{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:8px;font-size:.9rem}
.cwho label{display:flex;gap:6px;align-items:center;cursor:pointer}
.msl .nexttag{font-size:.72rem;font-weight:700;color:var(--brass);border:1px solid var(--brass);padding:0 6px;margin-left:6px}

/* Forms */
.field{display:grid;gap:3px;font-size:.85rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--rule);background:var(--paper);font-weight:500;color:var(--ink);width:100%}
.field textarea{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}

/* Notes */
.notes{list-style:none;margin:12px 0 0;padding:0}
.notes li{border-top:1px solid var(--rule);padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.notes .when{font-size:.78rem;color:var(--muted)}
.notes .txt{white-space:pre-wrap;overflow-wrap:anywhere;grid-column:1}
.notes .auto .txt{color:var(--muted);font-style:italic}
.notes .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 6px;grid-row:1/3;grid-column:2;align-self:start}
.notes .x:hover{color:var(--bad)}

/* Email preview */
.mail{margin-top:12px;padding:16px;background:#FFFFFF;color:#222222;border:1px solid var(--rule)}
.subj{font-size:.9rem;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

/* Printable desk sheet: only the sheet prints */
#printSheet{display:none}
@media print{
  @page{margin:.5in}
  body{background:#fff!important;color:#000!important}
  body>*:not(#printSheet){display:none!important}
  #printSheet{display:block;font-family:Calibri,Arial,Helvetica,sans-serif;font-size:10.5pt;color:#000;line-height:1.35}
  #printSheet .ph{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:6px}
  #printSheet h1{font-size:18pt;margin:0}
  #printSheet .pr{text-align:right;font-size:9pt;color:#444;white-space:nowrap}
  #printSheet .close{margin-top:8px;padding:6px 10px;border:1.5px solid #000;font-size:11pt}
  #printSheet h2{font-size:12pt;margin:14px 0 4px;border-bottom:1px solid #888;padding-bottom:2px}
  #printSheet h3{font-size:10.5pt;margin:6px 0 2px}
  #printSheet h2 span{font-weight:400;font-size:9.5pt;color:#444}
  #printSheet table{width:100%;border-collapse:collapse}
  #printSheet td{padding:2px 4px;vertical-align:top}
  #printSheet td.b{width:22px;font-size:13pt;line-height:1}
  #printSheet td.n{width:24px;font-weight:700}
  #printSheet td.d{width:70px;text-align:right;color:#444}
  #printSheet tr.sub td{font-size:9.5pt;padding-left:22px}
  #printSheet tr.done td{color:#666;text-decoration:line-through}
  #printSheet tr.done td.b{text-decoration:none}
  #printSheet .nt{margin:0;padding-left:16px;font-size:9.5pt}
  #printSheet .nt span{color:#555}
  #printSheet .none{color:#555;margin:2px 0}
  #printSheet .lines{height:1.2in;background:repeating-linear-gradient(#fff 0 26px,#999 26px 27px);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printSheet tr,#printSheet li{break-inside:avoid}
}
dialog{border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px;display:grid;gap:12px}
.fsub{font-size:.95rem;margin:4px 0 -4px;border-top:1px solid var(--rule);padding-top:10px}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Mortgage Market Dashboard</a>
  <div id="app"></div>
  <p class="note-local">Client information is saved only in this browser on this device. It is never put in the website's public code. Use <b>Download backup</b> regularly so nothing is lost.</p>
</div>

<dialog id="dlg">
  <form method="dialog" id="cform">
    <h2 id="dlgTitle">New client</h2>
    <div class="fgrid">
      <label class="field">First name *<input name="first" required autocomplete="off"></label>
      <label class="field">Last name<input name="last" autocomplete="off"></label>
      <label class="field">Email<input name="email" type="email" autocomplete="off"></label>
      <label class="field">Phone<input name="phone" type="tel" autocomplete="off"></label>
    </div>
    <h3 class="fsub">Co-borrower <span class="muted small">(optional)</span></h3>
    <div class="fgrid">
      <label class="field">First name<input name="coFirst" autocomplete="off"></label>
      <label class="field">Last name<input name="coLast" autocomplete="off"></label>
      <label class="field">Email<input name="coEmail" type="email" autocomplete="off"></label>
      <label class="field">Phone<input name="coPhone" type="tel" autocomplete="off"></label>
    </div>
    <label class="field">Property address<input name="address" autocomplete="off"></label>
    <div class="fgrid">
      <label class="field">Loan type<select name="loan">
        <option value="conv">Conventional</option><option value="fha">FHA</option><option value="va">VA</option><option value="usda">USDA</option><option value="jumbo">Jumbo</option></select></label>
      <label class="field">Purchase or refinance<select name="purpose"><option value="buy">Purchase</option><option value="refi">Refinance</option></select></label>
      <label class="field">Borrower's income<select name="who"><option value="w2">W-2 employee</option><option value="self">Self-employed</option><option value="retired">Retired</option></select></label>
      <label class="field">Submitted to processing<input name="procDate" type="date"></label>
      <label class="field">Target closing date<input name="closing" type="date"></label>
    </div>
    <div class="dlgbtns">
      <button class="tbtn" value="cancel" formnovalidate>Cancel</button>
      <button class="tbtn primary" value="save" id="dlgSave">Save client</button>
    </div>
  </form>
</dialog>
<div id="printSheet" aria-hidden="true"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const LOANS={conv:"Conventional",fha:"FHA",va:"VA",usda:"USDA",jumbo:"Jumbo"};
  const PURP={buy:"purchase",refi:"refinance"};
  const WHO={w2:"W-2",self:"Self-employed",retired:"Retired"};

  // Milestones, in order. "msg" is the default line for the update email; it can be edited before copying.
  const MS=[
    {k:"contract",   name:"Contract received",              msg:"We have your signed purchase contract, and your loan is officially underway."},
    {k:"discSent",   name:"Disclosures sent",               msg:"Your initial loan disclosures have been sent. Please review and e-sign them as soon as you can so we can keep things moving."},
    {k:"discSigned", name:"Disclosures signed",             msg:"Thank you for signing your disclosures. Next, your file goes to underwriting."},
    {k:"submitted",  name:"Loan submitted to underwriting", msg:"Your loan has been submitted to underwriting for review. Normal turn times are 2 to 3 business days, and I'll let you know as soon as we hear back."},
    {k:"condAppr",   name:"Conditionally approved",         msg:"Great news: your loan is conditionally approved! The underwriter has a short list of items to finalize, and I'll help you with each one."},
    {k:"addlDocs",   name:"Additional documents requested", short:"Docs requested", msg:"The underwriter has asked for a few more items. I'll send you the list, and please send them as soon as you can."},
    {k:"addlDocsRecv",name:"Additional documents received", short:"Docs received", msg:"Thank you! We received your additional documents and passed them to the underwriter for review."},
    {k:"apprOrdered",name:"Appraisal ordered",   short:"Ordered",  msg:"The appraisal has been ordered. The appraiser may reach out to you or your agent to schedule a visit.",
      alts:[{label:"Standard",msg:"The appraisal has been ordered. The appraiser may reach out to you or your agent to schedule a visit."},
            {label:"With payment link",msg:"The appraisal has been ordered. The appraiser may reach out to you or your agent to schedule a visit. You'll also receive a separate email with a secure link to pay for the appraisal. Please keep an eye out for it (and check your spam folder) and complete the payment as soon as you can so the appraiser can schedule the visit."}]},
    {k:"apprRecv",   name:"Appraisal received",  short:"Received", msg:"The appraisal is back, and we're one step closer to the finish line."},
    {k:"ctcSubmitted",name:"Submitted for clear to close", msg:"Your file has been submitted to the underwriter for final clear to close. We're almost there!"},
    {k:"closingSched",name:"Closing scheduled with title company", short:"Closing scheduled", msg:""},
    {k:"ctc",        name:"Clear to close",                 msg:"You're clear to close! The title company will reach out to schedule your closing. Congratulations!"}
  ];
  const msBy=k=>MS.find(m=>m.k===k);
  const TRACK_H=90; // display height of the tracker pictures at 600px wide
  // The main chain shown in the tracker. Two steps carry sub-steps listed underneath them.
  // "Appraisal" has no checkbox of its own: it is complete when "Appraisal received" is checked.
  const MAIN=[
    {k:"contract"},{k:"discSent"},{k:"discSigned"},{k:"submitted"},
    {k:"condAppr",subs:["addlDocs","addlDocsRecv"]},
    {k:"appraisal",name:"Appraisal",group:true,doneKey:"apprRecv",subs:["apprOrdered","apprRecv"]},
    {k:"ctcSubmitted",subs:["closingSched"]},
    {k:"ctc"}
  ].map(n=>({...n,name:n.name||msBy(n.k).name}));
  // Order used for "Next": additional documents are optional, so they are not part of it.
  const PATH=["contract","discSent","discSigned","submitted","condAppr","apprOrdered","apprRecv","ctcSubmitted","ctc"];
  const fmtWhen=v=>v?new Date(v).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
  // Default email message for a milestone (a few depend on the client's details).
  const purposeFix=(c,m)=>{
    if(c.purpose==="refi"&&m.k==="contract")return "We have everything we need to start your refinance, and your loan is officially underway.";
    if(m.k==="closingSched")return `Your closing has been scheduled with the title company${c.closingAt?" for "+fmtWhen(c.closingAt):""}. Please bring a valid photo ID, and I'll confirm the final details with you beforehand.`;
    if(m.alts)return m.alts[annVar[c.id+m.k]||0].msg;
    return m.msg;
  };
  let annVar={};
  // ---------- Underwriting conditions (stips) ----------
  // Pasted text is split into one condition per number ("1.", "2)", "#3", "Condition 4:"); lines without a number join the one above.
  // Returns [{text, who}] where who is "b" (borrower) or "lo" (loan officer).
  // Headings in the pasted text such as "Borrower Conditions:" or "LO Conditions:" switch the group;
  // everything else uses the group picked on the page.
  function parseConds(txt,defWho){
    const NUM=[
      /^(?:condition|cond|item|stip|prior to doc|ptd|ptf)\.?\s*#?\s*(\d{1,3})\s*[\.\):\-–]*\s+(.*)$/i,
      /^#\s*(\d{1,3})\s*[\.\):\-–]*\s+(.*)$/,
      /^\(?(\d{1,3})\s*[\.\):\-–]+\s*(.*)$/,
    ];
    const headingWho=t=>{
      const short=t.length<=60&&(/:\s*$/.test(t)||t.split(/\s+/).length<=5);
      if(!short)return null;
      if(/\b(borrower|buyer|client)s?'?s?\b/i.test(t))return "b";
      if(/\b(loan officer|lo|lender|internal|processor)s?'?s?\b/i.test(t))return "lo";
      return null;
    };
    const out=[];let who=defWho||"b",sawNum=false,firstNum=-1;
    String(txt).replace(/\r/g,"").split("\n").forEach(line=>{
      const t=line.trim();if(!t)return;
      let m=null;for(const re of NUM){m=t.match(re);if(m)break;}
      if(m){if(!sawNum){sawNum=true;firstNum=out.length;}out.push({text:m[2].trim(),who});return;}
      const h=headingWho(t);
      if(h){who=h;if(!sawNum){sawNum=true;firstNum=out.length;}return;}
      if(/^[\-•*·]\s+/.test(t))out.push({text:t.replace(/^[\-•*·]\s+/,""),who});
      else if(out.length)out[out.length-1].text=(out[out.length-1].text+" "+t).trim();
      else out.push({text:t,who});
    });
    // Lines above the first numbered item or heading (like "Conditions for approval:") are not conditions.
    return (sawNum?out.slice(firstNum):out).filter(x=>x.text);
  }
  // Each condition keeps the number it was given when added, so #3 stays #3 when the list re-sorts.
  function numberConds(c){let max=0;(c.conds||[]).forEach(x=>{if(x.n>max)max=x.n;});(c.conds||[]).forEach(x=>{if(!x.n)x.n=++max;});}
  const whoOf=x=>x.who==="lo"?"lo":"b";
  const openConds=(c,who)=>(numberConds(c),(c.conds||[]).filter(x=>!x.done&&(!who||whoOf(x)===who)).sort((a,b)=>a.n-b.n));
  // Open conditions first, then cleared ones; each group in number order.
  const sortedConds=(c,who)=>(numberConds(c),(c.conds||[]).filter(x=>!who||whoOf(x)===who).sort((a,b)=>(a.done-b.done)||(a.n-b.n)));
  let condWho="b";
  let condOpen={};

  // ---------- Storage (this browser only) ----------
  const KEY="clients-v1";
  let clients=[];
  try{clients=JSON.parse(localStorage.getItem(KEY)||"[]")||[];}catch(e){clients=[];}
  let storageOK=true;
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(clients));storageOK=true;}
    catch(e){storageOK=false;say("This browser isn't letting the page save. It may be in private mode.");}
  }
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
  const fmt=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"});};
  const stamp=()=>new Date().toISOString();
  const fmtStamp=s=>new Date(s).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const fullName=c=>[c.first,c.last].filter(Boolean).join(" ");
  const coName=c=>[c.coFirst,c.coLast].filter(Boolean).join(" ");
  // Greeting uses both first names when there is a co-borrower: "Hi Kevin and Maria,"
  const greet=c=>[c.first,c.coFirst].filter(Boolean).join(" and ")||"there";
  const closingOf=c=>c.closingAt?fmt(c.closingAt.slice(0,10)):c.closing?fmt(c.closing):"";
  const nodeKey=n=>n.group?n.doneKey:n.k;
  const nodeDone=(c,n)=>!!(c.ms&&c.ms[nodeKey(n)]);
  const doneCount=c=>MAIN.filter(n=>nodeDone(c,n)).length;
  const stageOf=c=>{const i=MAIN.findIndex(n=>!nodeDone(c,n));return i<0?MAIN.length:i;};
  const current=c=>{let cur=null;MS.forEach(m=>{if(c.ms&&c.ms[m.k])cur=m;});return cur;};
  const nextStep=c=>{const k=PATH.find(k=>!(c.ms&&c.ms[k]));return k?msBy(k):null;};
  const touch=c=>{c.updated=stamp();};

  const toastEl=$("toast");let tt;
  function say(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("on"),3200);}

  // ---------- Routing: #client=<id> shows one client; otherwise the list ----------
  let tab="active", q="";
  window.addEventListener("hashchange",render);
  function go(id){location.hash=id?"client="+id:"";}
  function render(){
    const m=location.hash.match(/client=([\w]+)/);
    const c=m&&clients.find(x=>x.id===m[1]);
    if(c)renderClient(c);else renderList();
    window.scrollTo(0,0);
  }

  // ---------- Backup ----------
  function backupNote(){
    if(!clients.length)return"";
    let last=null;try{last=localStorage.getItem("clients-backup");}catch(e){}
    const days=last?Math.floor((Date.now()-new Date(last))/864e5):null;
    if(last&&days<7)return"";
    return `<div class="backupwarn"><span>${last?`Your last backup was ${days} days ago.`:"You haven't downloaded a backup yet."} Client info lives only in this browser, so keep a copy.</span><button class="tbtn" data-act="backup">Download backup</button></div>`;
  }
  function backup(){
    const blob=new Blob([JSON.stringify({app:"client-tracker",version:1,saved:stamp(),clients},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`clients-backup-${today()}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    try{localStorage.setItem("clients-backup",stamp());}catch(e){}
    say("Backup downloaded. Keep it somewhere safe, like your work drive.");render();
  }
  $("restoreFile").addEventListener("change",async ev=>{
    const f=ev.target.files[0];ev.target.value="";if(!f)return;
    try{
      const data=JSON.parse(await f.text());
      const list=Array.isArray(data)?data:data.clients;
      if(!Array.isArray(list)||list.some(c=>!c||typeof c.id!=="string"||typeof c.first!=="string"))throw new Error("bad");
      const mode=clients.length?confirm(`Restore ${list.length} client(s) from this backup?\n\nOK = add them to your current list (matching clients are replaced)\nCancel = don't restore`):true;
      if(!mode)return;
      list.forEach(c=>{const i=clients.findIndex(x=>x.id===c.id);if(i>=0)clients[i]=c;else clients.push(c);});
      save();say(`Restored ${list.length} client(s).`);go("");render();
    }catch(e){alert("That file isn't a client tracker backup.");}
  });

  // ---------- Client list ----------
  function renderList(){
    const act=clients.filter(c=>c.status!=="inactive"), ina=clients.filter(c=>c.status==="inactive");
    const shown=(tab==="active"?act:ina).filter(c=>!q||(fullName(c)+" "+coName(c)+" "+(c.address||"")+" "+(c.email||"")+" "+(c.coEmail||"")).toLowerCase().includes(q.toLowerCase()))
      .sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));
    $("app").innerHTML=`
      <div class="top">
        <div><h1>Clients</h1><div class="muted small">${act.length} active · ${ina.length} inactive</div></div>
        <div class="acts">
          <button class="tbtn primary" data-act="new">+ New client</button>
          <button class="tbtn" data-act="backup"${clients.length?"":" disabled"}>Download backup</button>
          <button class="tbtn" data-act="restore">Restore backup</button>
        </div>
      </div>
      ${backupNote()}
      <div class="listbar">
        <div class="tabs" role="group" aria-label="Show">
          <button data-tab="active" aria-pressed="${tab==="active"}">Active (${act.length})</button>

        </div>
        <input class="search" id="search" type="search" placeholder="Search name, address or email" value="${esc(q)}" aria-label="Search clients">
      </div>
      ${shown.length?`<ul class="rows">${shown.map(c=>{
        const n=doneCount(c), cur=current(c), nx=nextStep(c), stg=stageOf(c), oc=openConds(c).length;
        const mini=MAIN.map((nd,i)=>(i?`<i class="${i<=stg&&nodeDone(c,MAIN[i-1])?"on":""}"></i>`:"")+`<b class="${nodeDone(c,nd)?"done":i===stg?"next":""}" title="${esc(nd.name)}"></b>`).join("");
        return `<li><button class="row" data-open="${c.id}">
          <div><div class="nm">${esc(fullName(c))}${coName(c)?` <span class="co">&amp; ${esc(coName(c))}</span>`:""}</div>
            <div class="sub">${esc(LOANS[c.loan]||"")} ${esc(PURP[c.purpose]||"")}${c.address?" · "+esc(c.address):""}${oc?` · <b style="color:var(--brass)">${oc} condition${oc===1?"":"s"} open</b>`:""}</div></div>
          <div><div class="mini" aria-label="${n} of ${MAIN.length} steps complete">${mini}</div>
            <div class="stat"><span><b>${cur?esc(cur.name):"Not started"}</b>${cur?" · "+fmt(c.ms[cur.k]):""}</span>
            <span class="muted">${nx?"Next: "+esc(nx.name):"Done"}</span></div></div>
          <dl class="dates"><div><dt>Processing</dt><dd>${c.procDate?fmt(c.procDate):"—"}</dd></div><div><dt>Closing</dt><dd>${closingOf(c)||"—"}</dd></div><div><dt>Last activity</dt><dd>${c.updated?fmt(c.updated.slice(0,10)):"—"}</dd></div></dl>
        </button></li>`;}).join("")}</ul>`
      :`<div class="panel empty">${clients.length?(q?"No clients match that search.":`No ${tab} clients.`):`No clients yet. Press <b>+ New client</b> to add your first one.`}</div>`}`;
    const s=$("search");
    s.addEventListener("input",()=>{q=s.value;const pos=s.selectionStart;renderList();const n=$("search");n.focus();n.setSelectionRange(pos,pos);});
  }

  // ---------- New / edit client ----------
  let editing=null;
  function openForm(c){
    editing=c||null;
    const f=$("cform");f.reset();
    $("dlgTitle").textContent=c?"Edit client":"New client";
    if(c)["first","last","email","phone","coFirst","coLast","coEmail","coPhone","address","loan","purpose","who","procDate","closing"].forEach(k=>{if(c[k]!=null)f.elements[k].value=c[k];});

  }
  $("dlg").addEventListener("close",()=>{

    if(editing){Object.assign(editing,data);touch(editing);save();render();say("Client updated.");}
    else{

  // ---------- One client ----------
  let annKey=null, annMsg={}, includeAll=true, includeConds=false, includeList=false, includeUp=null;
  // Upload link: the one saved on the document request page (same browser), unless the client has their own.
  const isLink=v=>/^(https?:\/\/)?[^\s\/]+\.[^\s]+$/i.test(v||"")&&v.length<500;

  const asHref=v=>v?(/^https?:\/\//i.test(v)?v:"https://"+v):"";
  const DOC_MS=["condAppr","addlDocs"];

  try{includeList=localStorage.getItem("ms-list")==="1";}catch(e){}
  function renderClient(c){

    let me="";try{me=localStorage.getItem("req-me")||"";}catch(e){}
    $("app").innerHTML=`
      <button class="back" data-act="list">← All clients</button>
      <div class="dhead">
        <div>
          <h1>${esc(fullName(c))}</h1>
          <div class="info">${[LOANS[c.loan]+" "+PURP[c.purpose],WHO[c.who],c.address,c.phone,c.email].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
          ${coName(c)?`<div class="info">${["Co-borrower: "+coName(c),c.coPhone,c.coEmail].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}
          <div class="info">${[c.procDate?"Submitted to processing "+fmt(c.procDate):"",closingOf(c)?"Closing "+closingOf(c):"","Last activity "+fmt((c.updated||stamp()).slice(0,10))].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
        </div>
        <div class="acts">
          <div class="seg" role="group" aria-label="Status">
            <button data-status="active" aria-pressed="${c.status!=="inactive"}">Active</button>
            <button data-status="inactive" aria-pressed="${c.status==="inactive"}">Inactive</button>
          </div>
          <button class="tbtn" data-act="print">Print sheet</button>
          <button class="tbtn" data-act="edit">Edit</button>
          <button class="tbtn danger" data-act="delete">Delete</button>
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
          <h2>Loan milestones</h2><span class="muted small">${n} of ${MAIN.length} steps complete${nx?" · Next: <b style=\"color:var(--brass)\">"+esc(nx.name)+"</b>":""}</span>
        </div>
        <div class="tracker" aria-hidden="true">${MAIN.map((nd,i)=>{
          const st=nodeDone(c,nd)?"done":(i===stg?"next":""), d=c.ms[nodeKey(nd)];
          return `<div class="st ${st}"><div class="dot">${st==="done"?"✓":i+1}</div><div class="lbl">${esc(nd.name)}</div><div class="dt">${d?fmt(d):""}</div>`+
            (nd.subs?`<div class="subs">${nd.subs.map(k=>`<div class="sb${c.ms[k]?" done":""}">${c.ms[k]?"✓":"○"} ${esc(msBy(k).short)}</div>`).join("")}</div>`:"")+`</div>`;}).join("")}</div>
        <ul class="msl">${MAIN.map((nd,i)=>{
          const st=nodeDone(c,nd)?"done":(i===stg?"next":"");
          const item=(k,sub)=>{const m=msBy(k), d=c.ms[k], isNx=nx&&nx.k===k;
            return `<li class="${sub?"sub ":""}${d?"done":isNx?"next":""}"><span class="dot">${d?"✓":sub?"":i+1}</span>
            <div class="lblwrap"><label><input type="checkbox" data-ms="${k}"${d?" checked":""}>${esc(sub?m.short:m.name)}${isNx?'<span class="nexttag">NEXT</span>':""}</label>${k==="closingSched"?`<label class="closeat">Closing date &amp; time <input type="datetime-local" data-closeat value="${esc(c.closingAt||"")}"></label>`:""}</div>
            ${d?`<input type="date" data-msdate="${k}" value="${d}" aria-label="Date for ${esc(m.name)}">`:`<span class="muted small">—</span>`}</li>`;};
          const head=nd.group?`<li class="${st}"><span class="dot">${st==="done"?"✓":i+1}</span><span class="grp">${esc(nd.name)} <span class="muted small">(check the steps below)</span></span><span></span></li>`:item(nd.k,false);
          return head+(nd.subs||[]).map(k=>item(k,true)).join("");}).join("")}</ul>
      </div>
      ${condsBlock(c)}

      <div class="grid">
        <div class="stack">
          <div class="panel">

            <div class="fgrid">
              <label class="field">Milestone to announce<select id="annSel">${MS.map(m=>`<option value="${m.k}"${m.k===annKey?" selected":""}>${esc(m.name)}${c.ms[m.k]?"":" (not checked yet)"}</option>`).join("")}</select></label>
              <label class="field">Sign off as<input id="me" value="${esc(me)}" placeholder="Your name and phone" autocomplete="off"></label>
            </div>
            ${ann.alts?`<label class="field" style="margin-top:10px">Message version<select id="annVar">${ann.alts.map((a,i)=>`<option value="${i}"${(annVar[c.id+ann.k]||0)===i?" selected":""}>${esc(a.label)}</option>`).join("")}</select></label>`:""}
            <label class="field" style="margin-top:10px">Message<textarea id="annMsg">${esc(annMsg[c.id+annKey]??purposeFix(c,ann))}</textarea></label>
            <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.9rem;cursor:pointer"><input type="checkbox" id="incAll"${includeAll?" checked":""} style="width:18px;height:18px;accent-color:var(--ink)"> Show the progress bar in the email</label>
            <label style="display:flex;gap:8px;align-items:center;margin:6px 0 0 26px;font-size:.9rem;cursor:pointer"><input type="checkbox" id="incList"${includeList?" checked":""}${includeAll?"":" disabled"} style="width:18px;height:18px;accent-color:var(--ink)"> Also list each step with dates under the bar</label>
            <label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:.9rem;cursor:pointer"><input type="checkbox" id="incConds"${includeConds?" checked":""}${openConds(c,"b").length?"":" disabled"} style="width:18px;height:18px;accent-color:var(--ink)"> Include the borrower's open conditions${openConds(c,"b").length?` (${openConds(c,"b").length})`:" (none open)"}</label>
            <label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:.9rem;cursor:pointer"><input type="checkbox" id="incUp"${upOn()?" checked":""} style="width:18px;height:18px;accent-color:var(--ink)"> Add the "Upload documents" button</label>
            <div class="upline small">${upOn()?(uploadLink(c)?`Button links to ${isLink(c.uploadLink)?"this client's link":"your saved link"}: <span class="muted">${esc(uploadLink(c))}</span>`:`<span style="color:var(--bad)">No upload link yet.</span> Save one on the document request page, or add one for this client below. Without a link, the button is a picture you can link in Outlook.`):""}
              ${upOn()?`<label class="field" style="margin-top:6px">Upload link for this client only <span class="muted" style="font-weight:500">(optional)</span><input id="cUp" value="${esc(c.uploadLink||"")}" placeholder="Leave blank to use your saved link" inputmode="url" autocomplete="off"></label>`:""}</div>
            <div class="acts" style="margin-top:12px">
              <button class="tbtn primary" data-act="copyMail">Copy email</button>
              <button class="tbtn" data-act="copySubj">Copy subject</button>
            </div>
            <p class="subj"><b class="muted">Subject:</b> <span id="subjTxt"></span></p>
            <div class="mail" id="mailPrev"></div>
          </div>
        </div>
        <div class="stack">
          <div class="panel">
            <h2>Documents</h2>
            <p class="muted small" style="margin:4px 0 10px">Opens the document request page set up for ${esc(c.first)}'s loan.</p>
            <a class="tbtn primary" href="${docLink}">Build document request</a>
          </div>
          <div class="panel">
            <h2>Notes</h2>
            <label class="field" style="margin-top:10px"><span class="muted" style="font-weight:600">Add a note</span><textarea id="noteTxt" placeholder="Called about appraisal, waiting on HOA cert…"></textarea></label>
            <div class="acts" style="margin-top:8px"><button class="tbtn primary" data-act="addNote">Add note</button></div>
            <ul class="notes">${(c.notes||[]).slice().reverse().map(nt=>`<li class="${nt.auto?"auto":""}"><span class="when">${fmtStamp(nt.t)}</span><span class="txt">${esc(nt.text)}</span><button class="x" data-delnote="${nt.t}" aria-label="Delete note">×</button></li>`).join("")||`<li><span class="txt muted">No notes yet.</span></li>`}</ul>
          </div>
        </div>
      </div>`;
    renderMail(c);
    $("annSel").addEventListener("change",e=>{annKey=e.target.value;includeUp=null;if(annKey==="condAppr"&&openConds(c,"b").length)includeConds=true;renderClient(c);});
    if($("annVar"))$("annVar").addEventListener("change",e=>{annVar[c.id+annKey]=+e.target.value;delete annMsg[c.id+annKey];renderClient(c);});
    $("annMsg").addEventListener("input",e=>{annMsg[c.id+annKey]=e.target.value;renderMail(c);});
    $("incAll").addEventListener("change",e=>{includeAll=e.target.checked;$("incList").disabled=!includeAll;renderMail(c);});
    $("incConds").addEventListener("change",e=>{includeConds=e.target.checked;renderMail(c);});
    $("incUp").addEventListener("change",e=>{includeUp=e.target.checked;renderClient(c);});
    if($("cUp"))$("cUp").addEventListener("change",e=>{const v=e.target.value.trim();
      if(v&&!isLink(v)){say("That isn't a web link. Paste the Dropbox request link.");e.target.value=c.uploadLink||"";return;}
      c.uploadLink=v;touch(c);save();renderClient(c);say(v?"Upload link saved for this client.":"This client now uses your saved link.");});
    $("incList").addEventListener("change",e=>{includeList=e.target.checked;try{localStorage.setItem("ms-list",includeList?"1":"0");}catch(x){}renderMail(c);});
    $("me").addEventListener("input",e=>{try{localStorage.setItem("req-me",e.target.value);}catch(x){}renderMail(c);});
  }

  function condsBlock(c){
    const all=c.conds||[], open=openConds(c), ob=openConds(c,"b").length, ol=openConds(c,"lo").length, show=condOpen[c.id]??false;
    const split=`<span class="csplit">${ob} borrower · ${ol} loan officer</span>`;
    const banner=all.length
      ?`<div class="cbanner${open.length?"":" clear"}"><span class="arrow" aria-hidden="true">→</span><span class="cnum">${open.length||"✓"}</span>
          <span class="grow">${open.length?`<b>Conditional approval.</b> Underwriting conditions are open for review. ${split}`:`<b>All conditions cleared.</b> ${all.length} of ${all.length} checked off.`}</span>
          <button class="tbtn gold" data-act="toggleConds" aria-expanded="${show}">${show?"Hide conditions":"View conditions"}</button></div>`
      :`<div class="cbanner empty"><span class="arrow" aria-hidden="true">+</span><span class="grow muted">No underwriting conditions yet. Paste them here when your processor sends them.</span>
          <button class="tbtn" data-act="toggleConds" aria-expanded="${show}">${show?"Close":"Add conditions"}</button></div>`;
    if(!show)return banner;
    const group=(who,title)=>{const list=sortedConds(c,who), op=list.filter(x=>!x.done).length;
      if(!list.length)return "";
      return `<div class="cgroup"><h4>${title} <span class="muted small">${op} open · ${list.length-op} cleared</span></h4>
        <ol class="clist">${list.map((x,i,arr)=>`${x.done&&(i===0||!arr[i-1].done)?`<li class="csep">Cleared</li>`:""}<li class="${x.done?"done":""}"><span class="cn">${x.n}</span>
          <label><input type="checkbox" data-cond="${x.id}"${x.done?" checked":""} aria-label="Cleared"><span class="ct">${esc(x.text)}</span></label>
          <span class="cact"><button class="cmove" data-condwho="${x.id}" title="Move to ${who==="b"?"loan officer":"borrower"} conditions">${who==="b"?"→ LO":"→ Borrower"}</button><button class="x" data-delcond="${x.id}" aria-label="Remove condition ${x.n}">×</button></span></li>`).join("")}</ol></div>`;};
    return banner+`<div class="panel conds">
        ${all.length?`<div class="chead"><h3>Conditions <span class="muted small">${open.length} open · ${all.length-open.length} cleared</span></h3><button class="tbtn danger" data-act="clearConds">Remove all</button></div>
          ${group("b","Borrower conditions")}${group("lo","Loan officer conditions")}`:""}
        <label class="field" style="margin-top:12px">Paste conditions from your processor's email<textarea id="condTxt" placeholder="Borrower conditions:&#10;1. Updated pay stub covering 30 days&#10;2. Letter of explanation for large deposit on 10/14&#10;LO conditions:&#10;3. Updated title commitment"></textarea></label>
        <div class="cwho" role="radiogroup" aria-label="Who these conditions are for">
          <span class="muted small">These are:</span>
          <label><input type="radio" name="condWho" value="b"${condWho==="b"?" checked":""}> Borrower conditions</label>
          <label><input type="radio" name="condWho" value="lo"${condWho==="lo"?" checked":""}> Loan officer conditions</label>
        </div>
        <div class="acts" style="margin-top:8px"><button class="tbtn primary" data-act="addConds">Add conditions</button><span class="muted small" style="align-self:center">Numbered lines become separate conditions. Headings like "Borrower conditions" or "LO conditions" in the pasted text sort them automatically.</span></div>
      </div>`;
  }

  // ---------- Printable desk sheet ----------
  function printSheet(c){
    const box=d=>d?"&#9745;":"&#9744;";
    const info=[LOANS[c.loan]+" "+PURP[c.purpose],WHO[c.who]+" borrower",c.address,c.phone,c.email].filter(Boolean).map(esc).join(" &nbsp;·&nbsp; ")+
      (coName(c)?"<br>Co-borrower: "+[coName(c),c.coPhone,c.coEmail].filter(Boolean).map(esc).join(" &nbsp;·&nbsp; "):"")+
      (c.procDate?"<br>Submitted to processing "+esc(fmt(c.procDate)):"");
    const ms=MAIN.map((nd,i)=>{const d=c.ms[nodeKey(nd)];
      return `<tr><td class="b">${box(d)}</td><td><b>${i+1}. ${esc(nd.name)}</b></td><td class="d">${d?fmt(d):""}</td></tr>`+
        (nd.subs||[]).map(k=>{const sd=c.ms[k];return `<tr class="sub"><td></td><td>${box(sd)} ${esc(msBy(k).name)}${k==="closingSched"&&c.closingAt?" — <b>"+esc(fmtWhen(c.closingAt))+"</b>":""}</td><td class="d">${sd?fmt(sd):""}</td></tr>`;}).join("");}).join("");
    const conds=sortedConds(c), open=conds.filter(x=>!x.done), done=conds.filter(x=>x.done);
    const ctable=who=>{const l=sortedConds(c,who);if(!l.length)return "";
      return `<h3>${who==="b"?"Borrower conditions":"Loan officer conditions"}</h3><table class="cd">${l.map(x=>`<tr class="${x.done?"done":""}"><td class="b">${x.done?"&#9745;":"&#9744;"}</td><td class="n">${x.n}.</td><td>${esc(x.text)}</td></tr>`).join("")}</table>`;};
    const notes=(c.notes||[]).filter(x=>!x.auto).slice(-8).reverse();
    $("printSheet").innerHTML=`
      <div class="ph"><div><h1>${esc(fullName(c))}</h1><div>${info}</div></div>
        <div class="pr">Printed ${new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}<br>${doneCount(c)} of ${MAIN.length} steps complete</div></div>
      ${c.closingAt||c.closing?`<div class="close">Closing: <b>${c.closingAt?esc(fmtWhen(c.closingAt)):"target "+esc(fmt(c.closing))}</b></div>`:""}
      <h2>Milestones</h2><table class="ms">${ms}</table>
      <h2>Conditions ${conds.length?`<span>${open.length} open · ${done.length} cleared</span>`:""}</h2>
      ${conds.length?ctable("b")+ctable("lo"):`<p class="none">No conditions yet.</p>`}
      ${notes.length?`<h2>Recent notes</h2><ul class="nt">${notes.map(x=>`<li><span>${fmtStamp(x.t)}</span> ${esc(x.text)}</li>`).join("")}</ul>`:""}
      <h2>Notes</h2><div class="lines"></div>`;
    window.print();
  }

  // ---------- Milestone update email (inline styles + tables so it pastes well into Outlook) ----------
  function buildMail(c){
    const ann=MS.find(m=>m.k===annKey), msg=($("annMsg")?.value??purposeFix(c,ann)).trim(), me=($("me")?.value||"").trim();
    const n=doneCount(c), nx=nextStep(c), stage=stageOf(c), T7=MAIN.length;
    const oc=openConds(c,"b"), condsOn=includeConds&&oc.length>0;
    const upHref=asHref(uploadLink(c)), withUp=upOn();
    const SITE0=location.protocol.startsWith("http")&&location.hostname.endsWith("github.io")?location.href:"https://jfb315-dotcom.github.io/";
    const upImg=`<img src="${new URL("upload-button-v2.png",SITE0).href}" width="300" height="56" alt="UPLOAD DOCUMENTS" style="display:block;border:0;width:100%;max-width:300px;height:auto;font-family:Calibri,Arial,sans-serif;font-size:16pt;font-weight:bold;color:#1F4E79">`;
    const subject=`Loan update: ${ann.name}`;
    const F="font-family:Calibri,Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.4;color:#222222";
    const BLUE="#1F4E79", GREEN="#2C5234", GOLD="#A97A1E", GRAY="#9AA3AE";
    const date=c.ms[ann.k]?fmt(c.ms[ann.k]):"";
    // Tracker picture (hosted on the site; no client details in it): one per combination of the main stage,
    // the appraisal sub-steps (none / ordered / received) and the additional documents (none / requested / received).
    const ap=c.ms.apprRecv?2:c.ms.apprOrdered?1:0, dc=c.ms.addlDocsRecv?2:c.ms.addlDocs?1:0, cs=c.ms.closingSched?1:0;
    const SITE=location.protocol.startsWith("http")&&location.hostname.endsWith("github.io")?location.href:"https://jfb315-dotcom.github.io/";
    const trackImg=new URL(`img/tracker3/t-${stage}-${ap}-${dc}-${cs}.png`,SITE).href;
    const tracker=`<img src="${trackImg}" width="600" height="${TRACK_H}" alt="Loan progress: ${n} of ${T7} steps complete${nx?", next: "+esc(nx.name):""}" style="display:block;border:0;width:100%;max-width:600px;height:auto">`;
    // Outlook can drop inline styles on text when pasting, so colors and sizes are also set with <font> tags,
    // the heading underline sits on a table cell, and spacing comes from spacer rows. Each survives a paste.
    const fc=(col,size,pt,inner)=>`<font color="${col}"${size?` size="${size}"`:""} face="Calibri, Arial, sans-serif" style="color:${col}${pt?`;font-size:${pt}pt`:""}">${inner}</font>`;
    const sp=h=>`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse"><tr><td height="${h}" style="height:${h}px;font-size:1px;line-height:1px">&nbsp;</td></tr></table>`;
    // Main steps: mark in the first column. Sub-steps: indented one column, with their own small mark.
    const row=(mark,mc,txt,sub)=>sub
      ?`<tr><td width="26" style="width:26px;padding:0;${F}">&nbsp;</td><td valign="top" style="padding:0 0 4px 0;${F}">${fc(mc,"2","10",`<b>${mark}</b>`)}&nbsp;&nbsp;${txt}</td></tr>`
      :`<tr><td width="26" valign="top" style="width:26px;padding:0 0 5px 4px;${F}">${fc(mc,"","",`<b>${mark}</b>`)}</td><td valign="top" style="padding:0 0 5px 0;${F}">${txt}</td></tr>`;
    const rows=MAIN.map((nd,i)=>{
      const d=c.ms[nodeKey(nd)], isNext=i===stage;
      const mark=d?"&#10003;":isNext?"&#9679;":"&#9675;", mc=d?GREEN:isNext?GOLD:GRAY;
      const txt=d?`<b>${esc(nd.name)}</b> ${fc("#777777","","",fmt(d))}`:isNext?fc(GOLD,"","",`<b>Next: ${esc(nd.name)}</b>`):fc(GRAY,"","",esc(nd.name));
      return row(mark,mc,txt,false)+(nd.subs||[]).map(k=>{const sd=c.ms[k], m=msBy(k);
        const when=k==="closingSched"&&sd&&c.closingAt?" "+fc(BLUE,"2","10",`<b>${esc(fmtWhen(c.closingAt))}</b>`):"";
        return row(sd?"&#10003;":"&#9675;",sd?GREEN:GRAY,fc(sd?"#333333":GRAY,"2","10",esc(m.name)+(sd&&!when?" "+fc("#777777","2","10",fmt(sd)):"")+when),true);}).join("");
    }).join("");
    const html=`<div style="${F}"><p style="margin:0 0 10px 0">Hi ${esc(greet(c))},</p>`+sp(6)+
      `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse"><tr><td bgcolor="#EAF2EC" style="background:#EAF2EC;border-left:5px solid ${GREEN};padding:10px 14px;${F}">`+
      fc(GREEN,"2","9.5",`<b>MILESTONE REACHED${date?" · "+esc(date.toUpperCase()):""}</b>`)+`<br>`+
      fc(BLUE,"4","15",`<b>${esc(ann.name)}</b>`)+`</td></tr></table>`+sp(12)+
      `<p style="margin:0">${esc(msg).replace(/\n/g,"<br>")}</p>`+sp(14)+
      (condsOn?`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse"><tr><td style="border-bottom:2px solid ${BLUE};padding:0 0 3px 0;${F}">${fc(BLUE,"3","12","<b>Items still needed</b>")}</td></tr></table>`+sp(6)+
        `<p style="margin:0">${fc("#555555","2","10","The underwriter is asking for the following. Please send them as soon as you can.")}</p>`+sp(8)+
        `<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">${oc.map((x,i)=>row(`${i+1}.`,GOLD,esc(x.text),false)).join("")}</table>`+sp(14):"")+
      (withUp?`<p style="margin:0">Click the button below to upload your documents securely.</p>`+sp(8)+
        (upHref?`<a href="${esc(upHref)}" style="display:inline-block">${upImg}</a>`:upImg)+sp(16):"")+
      (includeAll?`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse"><tr><td style="border-bottom:2px solid ${BLUE};padding:0 0 3px 0;${F}">${fc(BLUE,"3","12","<b>Your loan progress</b>")}</td></tr></table>`+sp(6)+
        `<p style="margin:0">${fc("#555555","2","10",`${n} of ${T7} steps complete`)}</p>`+sp(10)+tracker+sp(includeList?10:14)+
        (includeList?`<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">${rows}</table>`+sp(8):""):"")+
      `<p style="margin:0">If you have any questions, just reply to this email or give me a call.</p>`+sp(10)+`<p style="margin:0">Thank you,<br>${esc(me||"[Your name]")}</p></div>`;
    const T=[`Hi ${greet(c)},`,"",`MILESTONE REACHED${date?" ("+date+")":""}: ${ann.name}`,"",msg,""];
    if(condsOn){T.push("ITEMS STILL NEEDED","The underwriter is asking for the following. Please send them as soon as you can.");oc.forEach((x,i)=>T.push(`${i+1}. ${x.text}`));T.push("");}
    if(withUp){T.push(`Upload your documents securely here: ${upHref||"[upload link]"}`,"");}
    if(includeAll){T.push(`YOUR LOAN PROGRESS (${n} of ${T7} steps complete)`);
      MAIN.forEach((nd,i)=>{const d=c.ms[nodeKey(nd)];T.push(d?`✓ ${nd.name} (${fmt(d)})`:i===stage?`➜ Next: ${nd.name}`:`○ ${nd.name}`);
        (nd.subs||[]).forEach(k=>{const sd=c.ms[k];T.push(`     ${sd?"✓":"○"} ${msBy(k).name}${sd?" ("+(k==="closingSched"&&c.closingAt?fmtWhen(c.closingAt):fmt(sd))+")":""}`);});});T.push("");}
    T.push("If you have any questions, just reply to this email or give me a call.","","Thank you,",me||"[Your name]");
    return {subject,html,text:T.join("\n"),ann,tracker,n,T7,nx};
  }
  function renderMail(c){const e=buildMail(c);$("subjTxt").textContent=e.subject;$("mailPrev").innerHTML=e.html;}

  async function copyRich(html,text){
    try{
      if(window.ClipboardItem&&navigator.clipboard.write)
        await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]);
      else await navigator.clipboard.writeText(text);
      return true;
    }catch(e){try{await navigator.clipboard.writeText(text);return true;}catch(x){window.prompt("Copy this:",text);return false;}}
  }
  async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){window.prompt("Copy this:",t);return false;}}

  // ---------- Clicks ----------
  const curClient=()=>{const m=location.hash.match(/client=([\w]+)/);return m&&clients.find(x=>x.id===m[1]);};
  document.addEventListener("click",async ev=>{
    const t=ev.target.closest("[data-act],[data-tab],[data-open],[data-status],[data-delnote],[data-delcond],[data-condwho]");if(!t)return;
    const c=curClient();
    if(t.dataset.tab){tab=t.dataset.tab;renderList();return;}
    if(t.dataset.open){annKey=null;go(t.dataset.open);return;}
    if(t.dataset.status&&c){c.status=t.dataset.status;touch(c);save();renderClient(c);say(c.status==="inactive"?"Moved to inactive.":"Marked active.");return;}
    if(t.dataset.condwho&&c){const x=(c.conds||[]).find(y=>y.id===t.dataset.condwho);if(x){x.who=whoOf(x)==="b"?"lo":"b";touch(c);save();renderClient(c);}return;}
    if(t.dataset.delcond&&c){c.conds=(c.conds||[]).filter(x=>x.id!==t.dataset.delcond);touch(c);save();renderClient(c);return;}
    if(t.dataset.delnote&&c){c.notes=c.notes.filter(n=>n.t!==t.dataset.delnote);save();renderClient(c);return;}
    switch(t.dataset.act){
      case "new":openForm();break;
      case "edit":openForm(c);break;
      case "list":go("");break;
      case "backup":backup();break;
      case "restore":$("restoreFile").click();break;
      case "delete":
        if(c&&confirm(`Delete ${fullName(c)} and all their notes? This can't be undone.\n\nTip: use "Inactive" instead to keep their history.`)){
          clients=clients.filter(x=>x.id!==c.id);save();go("");say("Client deleted.");}
        break;
      case "addNote":{
        const v=$("noteTxt").value.trim();if(!v){$("noteTxt").focus();return;}
        c.notes=c.notes||[];c.notes.push({t:stamp(),text:v});touch(c);save();renderClient(c);say("Note added.");break;}
      case "copyMail":{
        const e=buildMail(c);
        if(await copyRich(e.html,e.text)){
          c.notes=c.notes||[];c.notes.push({t:stamp(),text:`Milestone email copied: ${e.ann.name}`,auto:true});touch(c);save();renderClient(c);
          say("Email copied. Paste it into a new Outlook message.");}
        break;}
      case "toggleConds":condOpen[c.id]=!(condOpen[c.id]??false);renderClient(c);break;
      case "addConds":{
        const items=parseConds($("condTxt").value,condWho);if(!items.length){$("condTxt").focus();return;}
        c.conds=c.conds||[];const have=new Set(c.conds.filter(x=>!x.done).map(x=>x.text.toLowerCase()));
        numberConds(c);let max=c.conds.reduce((m,x)=>Math.max(m,x.n||0),0);
        let added=0;items.forEach(it=>{if(!have.has(it.text.toLowerCase())){c.conds.push({id:uid(),n:++max,text:it.text,who:it.who,done:false,added:stamp()});added++;}});
        if(added&&annKey==="condAppr"&&openConds(c,"b").length)includeConds=true;
        c.notes=c.notes||[];if(added)c.notes.push({t:stamp(),text:`${added} underwriting condition${added===1?"":"s"} added`,auto:true});
        touch(c);save();condOpen[c.id]=true;renderClient(c);say(added?`Added ${added} condition${added===1?"":"s"}.`:"Those conditions are already on the list.");break;}
      case "clearConds":if(confirm("Remove all conditions for this client?")){c.conds=[];touch(c);save();renderClient(c);}break;
      case "print":printSheet(c);break;
      case "copySubj":{const e=buildMail(c);if(await copyText(e.subject))say("Subject copied.");break;}
    }
  });
  document.addEventListener("change",ev=>{
    const c=curClient();if(!c)return;
    if(ev.target.dataset.cond){const x=(c.conds||[]).find(y=>y.id===ev.target.dataset.cond);
      if(x){x.done=ev.target.checked;x.doneAt=x.done?stamp():undefined;touch(c);save();renderClient(c);if(!openConds(c).length&&x.done)say("All conditions cleared!");}return;}
    if(ev.target.name==="condWho"){condWho=ev.target.value;return;}
    if(ev.target.hasAttribute("data-closeat")){c.closingAt=ev.target.value;delete annMsg[c.id+"closingSched"];touch(c);save();renderClient(c);return;}
    const k=ev.target.dataset.ms, kd=ev.target.dataset.msdate;
    if(k){
      if(ev.target.checked){c.ms[k]=today();annKey=k;includeUp=null;if(k==="condAppr"&&openConds(c,"b").length)includeConds=true;}else delete c.ms[k];
      touch(c);save();renderClient(c);
      if(ev.target.checked)say(`${MS.find(m=>m.k===k).name} checked. The update email below is ready to copy.`);
    }else if(kd&&ev.target.value){c.ms[kd]=ev.target.value;touch(c);save();renderClient(c);}
  });

  render();
})();
</script>
</body>
